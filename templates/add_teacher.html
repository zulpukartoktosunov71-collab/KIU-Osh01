<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мугалим кошуу | Куран жаттатуу борбору</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f4f7f6; color: #1f2937; }
        .page-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 270px; background: #073b2b; color: white; padding: 25px 18px; position: fixed; left: 0; top: 0; bottom: 0; }
        .brand { text-align: center; padding-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.18); margin-bottom: 20px; }
        .brand-logo { width: 80px; height: 80px; object-fit: contain; display: block; margin: 0 auto 15px; }
        .menu-link { display: block; color: white; text-decoration: none; padding: 13px 15px; margin: 6px 0; border-radius: 12px; }
        .menu-link:hover, .menu-link.active { background: rgba(255,255,255,0.15); font-weight: bold; }
        .logout { background: #8b1e1e; margin-top: 25px; }
        .main { margin-left: 270px; width: calc(100% - 270px); padding: 30px; }
        .form-card { max-width: 800px; background: white; border: 1px solid #e5e7eb; border-radius: 18px; padding: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #374151; }
        .form-group input { width: 100%; padding: 13px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; outline: none; }
        .message { padding: 13px; border-radius: 10px; margin-bottom: 20px; font-weight: 600; }
        .success { background: #e8f5ed; color: #146c43; }
        .error { background: #fdecec; color: #a11d1d; }
        .save-button { border: none; background: #0f5132; color: white; padding: 13px 20px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="page-layout">
    <aside class="sidebar">
        <div class="brand">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Логотип" class="brand-logo">
            <h2>Куран жаттатуу борбору</h2>
        </div>
        <a href="{{ url_for('admin') }}" class="menu-link">🏠 Башкы бет</a>
        <a href="{{ url_for('students') }}" class="menu-link">👨‍🎓 Студенттер</a>
        <a href="{{ url_for('parents') }}" class="menu-link">👨‍👩‍👦 Ата-энелер</a>
        <a href="{{ url_for('add_teacher') }}" class="menu-link active">👨‍🏫 Мугалим кошуу</a>
        <a href="{{ url_for('assign_teacher') }}" class="menu-link">📚 Сабак дайындоо</a>
        <a href="{{ url_for('quran_sections') }}" class="menu-link">📖 Куран бөлүмдөрү</a>
        <a href="{{ url_for('logout') }}" class="menu-link logout">🚪 Чыгуу</a>
    </aside>

    <main class="main">
        <section class="form-card">
            <h2>👨‍🏫 Жаңы мугалим кошуу</h2>
            {% if message %}<div class="message success">✅ {{ message }}</div>{% endif %}
            {% if error %}<div class="message error">❌ {{ error }}</div>{% endif %}

            <form method="POST" action="{{ url_for('add_teacher') }}">
                <div class="form-group">
                    <label>👤 Аты-жөнү</label>
                    <input type="text" name="name" placeholder="Мисалы: Абдуллах Абдиев" required>
                </div>
                <div class="form-group">
                    <label>🔑 Логин</label>
                    <input type="text" name="username" placeholder="abdullah01" required>
                </div>
                <div class="form-group">
                    <label>🔒 Сырсөз</label>
                    <input type="password" name="password" placeholder="Сырсөздү жазыңыз" required>
                </div>
                <button type="submit" class="save-button">💾 Мугалимди сактоо</button>
            </form>
        </section>
    </main>
</div>
</body>
</html>
