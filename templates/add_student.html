<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Студент кошуу | Куран жаттатуу борбору</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: linear-gradient(135deg, #eef7f3 0%, #f7faf9 100%); color: #17372c; }
        .page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
        .card { width: 100%; max-width: 720px; background: white; border: 1px solid #e2ece8; border-radius: 26px; padding: 30px; box-shadow: 0 18px 45px rgba(10, 60, 43, 0.12); }
        .header { text-align: center; margin-bottom: 22px; }
        .logo { width: 92px; height: 92px; object-fit: contain; margin-bottom: 14px; }
        .header h1 { margin: 0 0 8px; color: #123c2e; font-size: 26px; }
        .message.error { background: #fff0f0; color: #b42318; border: 1px solid #f6c7c7; padding: 12px; border-radius: 12px; margin-bottom: 15px; font-weight: 600; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; color: #2f524a; font-size: 13px; font-weight: 700; }
        input, select { width: 100%; padding: 13px 14px; border: 1px solid #d7e4df; border-radius: 12px; background: #fbfdfc; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #087653; box-shadow: 0 0 0 3px rgba(8, 118, 83, .08); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .save-button { width: 100%; margin-top: 10px; padding: 14px; border: none; border-radius: 12px; background: #087653; color: white; font-size: 15px; font-weight: 800; cursor: pointer; }
        .save-button:hover { background: #065e43; }
        .back { display: block; margin-top: 18px; text-align: center; padding: 12px; border-radius: 12px; background: #edf8f4; color: #087653; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
<div class="page">
    <div class="card">
        <div class="header">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Логотип" class="logo">
            <h1>👨‍🎓 Студент кошуу</h1>
            <p>Жаңы студенттин маалыматтарын киргизиңиз</p>
        </div>

        {% if error %}
            <div class="message error">❌ {{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('add_student') }}">
            <div class="form-group">
                <label>👤 Студенттин аты-жөнү</label>
                <input type="text" name="name" placeholder="Мисалы: Абдуллах Абдиев" required>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>🎂 Туулган жылы</label>
                    <input type="number" name="birth_year" placeholder="2010" required>
                </div>
                <div class="form-group">
                    <label>🎓 Курс жана Группасы</label>
                    <select name="course_id" required>
                        <option value="" disabled selected>-- Группаны тандаңыз --</option>
                        {% for course in courses %}
                            <option value="{{ course['id'] }}">{{ course['name'] }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>👨‍👩‍👦 Ата-энесинин аты</label>
                <input type="text" name="parent_name" placeholder="Мисалы: Абдиев Абдулла" required>
            </div>
            <div class="form-group">
                <label>📞 Телефон номери</label>
                <input type="tel" name="phone" placeholder="0700 123 456" required>
            </div>
            <button type="submit" class="save-button">💾 Студентти сактоо</button>
        </form>
        <a href="{{ url_for('admin') }}" class="back">← Админ панелге кайтуу</a>
    </div>
</div>
</body>
</html>
