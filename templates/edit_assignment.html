<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сабакты оңдоо | Куран жаттатуу борбору</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f4f7f6; color: #17372c; }
        .admin-container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 18px; border: 1px solid #e0e9e5; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .admin-header h1 { color: #0f5132; font-size: 24px; margin-bottom: 20px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #355b4e; }
        select { width: 100%; padding: 12px; border: 1px solid #d6e2dd; border-radius: 10px; background: white; font-size: 14px; outline: none; }
        select:focus { border-color: #087653; }
        .admin-button { width: 100%; background: #0f5132; color: white; border: none; padding: 13px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .admin-button:hover { background: #0b4027; }
        .back-link { display: inline-block; margin-top: 15px; color: #087653; text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="admin-container">
    <header class="admin-header">
        <h1>✏️ Дайындалган сабакты оңдоо</h1>
    </header>

    <section class="admin-section">
        <form method="POST">
            <div class="form-group">
                <label for="teacher_id">👨‍🏫 Мугалим:</label>
                <select id="teacher_id" name="teacher_id" required>
                    {% for teacher in teachers %}
                        <option value="{{ teacher['id'] }}" {% if teacher['id'] == assignment['teacher_id'] %}selected{% endif %}>
                            {{ teacher['name'] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="course_id">🎓 Курс:</label>
                <select id="course_id" name="course_id" required>
                    {% for course in courses %}
                        <option value="{{ course['id'] }}" {% if course['id'] == assignment['course_id'] %}selected{% endif %}>
                            {{ course['name'] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="subject_id">📖 Сабак:</label>
                <select id="subject_id" name="subject_id" required>
                    {% for subject in subjects %}
                        <option value="{{ subject['id'] }}" {% if subject['id'] == assignment['subject_id'] %}selected{% endif %}>
                            {{ subject['name'] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="admin-button">💾 Өзгөртүүнү сактоо</button>
        </form>
    </section>

    <section class="admin-section">
        <a href="{{ url_for('admin') }}" class="back-link">⬅️ Админ панелге кайтуу</a>
    </section>
</div>
</body>
</html>
