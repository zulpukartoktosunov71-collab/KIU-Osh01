<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ата-энени башкаруу | Куран жаттатуу борбору</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f7f6; color: #1f2937; }
        .page-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 270px; background: #0f5132; color: white; padding: 25px 18px; position: fixed; left: 0; top: 0; bottom: 0; }
        .menu-link { display: block; color: white; text-decoration: none; padding: 13px 15px; margin: 6px 0; border-radius: 10px; }
        .menu-link:hover, .menu-link.active { background: rgba(255,255,255,0.15); font-weight: bold; }
        .logout { background: #8b1e1e; margin-top: 25px; }
        .main { margin-left: 270px; width: calc(100% - 270px); padding: 30px; }
        .form-card { max-width: 800px; background: white; border: 1px solid #e5e7eb; border-radius: 18px; padding: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 13px; border: 1px solid #d1d5db; border-radius: 10px; outline: none; }
        .save-button { border: none; background: #0f5132; color: white; padding: 13px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="page-layout">
    <aside class="sidebar">
        <h2>Башкаруу системасы</h2>
        <a href="{{ url_for('admin') }}" class="menu-link">🏠 Башкы бет</a>
        <a href="{{ url_for('students') }}" class="menu-link">👨‍🎓 Студенттер</a>
        <a href="{{ url_for('parents') }}" class="menu-link active">👨‍👩‍👦 Ата-энелер</a>
        <a href="{{ url_for('logout') }}" class="menu-link logout">🚪 Чыгуу</a>
    </aside>

    <main class="main">
        <section class="form-card">
            <h2>👨‍👩‍👦 Ата-энени каттоо / өзгөртүү</h2>
            <form method="POST">
                <div class="form-group">
                    <label>👤 Ата-эненин аты-жөнү</label>
                    <input type="text" name="name" value="{{ parent['name'] if parent else '' }}" required>
                </div>
                <div class="form-group">
                    <label>👨‍🎓 Студент</label>
                    <select name="student_id" required>
                        <option value="">-- Студентти тандаңыз --</option>
                        {% for student in students %}
                            <option value="{{ student['id'] }}" {% if parent and student['id'] == parent['student_id'] %}selected{% endif %}>{{ student['name'] }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>🔑 Логин</label>
                    <input type="text" name="username" value="{{ parent['username'] if parent else '' }}" required>
                </div>
                <div class="form-group">
                    <label>🔒 Сырсөз</label>
                    <input type="text" name="password" value="{{ parent['password'] if parent else '' }}" required>
                </div>
                <button type="submit" class="save-button">💾 Сактоо</button>
            </form>
        </section>
    </main>
</div>
</body>
</html>
